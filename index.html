   <div class="grid">

<audio id="bg-audio" src="assets/audio/booha-world-index.mp3" preload="auto"></audio>

<script>
  // ── FLOATING ORBS ──
  const canvas = document.getElementById('orb-canvas');
  const ctx = canvas.getContext('2d');

  const COLORS = [
    'rgba(255, 224, 102, VAL)',   // yellow
    'rgba(126, 200, 227, VAL)',   // blue
    'rgba(184, 240, 160, VAL)',   // green
    'rgba(240, 160, 200, VAL)',   // pink
    'rgba(200, 160, 240, VAL)',   // purple
    'rgba(240, 200, 160, VAL)',   // peach
  ];

  let orbs = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function randomBetween(a, b) {
    return a + Math.random() * (b - a);
  }

  function createOrb(yOverride) {
    const r = randomBetween(2, 5.5);
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    return {
      x: randomBetween(0, W),
      y: yOverride !== undefined ? yOverride : randomBetween(0, H),
      r,
      baseR: r,
      color,
      speed: randomBetween(0.18, 0.55),
      drift: randomBetween(-0.18, 0.18),
      pulse: randomBetween(0, Math.PI * 2),
      pulseSpeed: randomBetween(0.008, 0.022),
      opacity: randomBetween(0.35, 0.75),
      flickerSeed: randomBetween(0, 1000),
      sparkBoost: 1,
      sparkTimer: Math.floor(randomBetween(180, 480)),
    };
  }

  function initOrbs() {
    orbs = [];
    const count = Math.floor((W * H) / 14000);
    for (let i = 0; i < count; i++) {
      orbs.push(createOrb());
    }
  }

  function drawOrb(o) {
    const pulse = Math.sin(o.pulse) * 0.4 + 1;
    const r = o.baseR * pulse * o.sparkBoost;

    // embers cool as they rise: dim toward the top of the screen
    const riseFade = Math.min(1, 0.25 + (o.y / H) * 0.85);
    // gentle organic flicker on top of the steady pulse
    const flicker = 0.82 + Math.sin(o.pulse * 3.3 + o.flickerSeed) * 0.12 + (Math.random() - 0.5) * 0.12;
    const eff = Math.max(0, Math.min(1, o.opacity * riseFade * flicker * o.sparkBoost));

    const colorStr = o.color.replace('VAL', eff);
    const glowStr = o.color.replace('VAL', eff * 0.35);

    const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 2.5);
    grad.addColorStop(0, colorStr);
    grad.addColorStop(0.5, glowStr);
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath();
    ctx.arc(o.x, o.y, r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      o.y -= o.speed;
      o.x += o.drift;
      o.pulse += o.pulseSpeed;

      // occasional bigger "spark pop", then decay back to normal size
      if (o.sparkBoost > 1) {
        o.sparkBoost = Math.max(1, o.sparkBoost - 0.03);
      }
      o.sparkTimer--;
      if (o.sparkTimer <= 0) {
        o.sparkBoost = randomBetween(1.6, 2.2);
        o.sparkTimer = Math.floor(randomBetween(240, 600));
      }

      // wrap around
      if (o.y < -20) {
        orbs[i] = createOrb(H + 20);
      }
      if (o.x < -20) o.x = W + 20;
      if (o.x > W + 20) o.x = -20;

      drawOrb(o);
    }

    requestAnimationFrame(tick);
  }

  resize();
  initOrbs();
  tick();
  window.addEventListener('resize', () => { resize(); initOrbs(); });

  // ── AUDIO: background music, gated behind the welcome overlay (see bottom of script) ──
  const audio = document.getElementById('bg-audio');
  audio.volume = 0.55;

  // ── SFX: lazy WebAudio, no audio files ──
  let actx = null;
  function ensureCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, opts = {}) {
    const ac = ensureCtx();
    if (!ac) return;
    const {
      type = 'sine',
      gain = 0.16,
      dur = 0.15,
      delay = 0,
      detune = 0,
      filterFreq = null,
      slideTo = null,
    } = opts;

    const start = ac.currentTime + delay;

    const osc = ac.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (detune) osc.detune.setValueAtTime(detune, start);
    if (slideTo) osc.frequency.linearRampToValueAtTime(slideTo, start + dur);

    const g = ac.createGain();
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(gain, start + Math.min(0.015, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);

    let node = osc;
    if (filterFreq) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(filterFreq, start);
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(ac.destination);

    osc.start(start);
    osc.stop(start + dur + 0.03);
  }

  // one small signature sound per tile, echoing that destination's mood
  const TILE_SOUNDS = {
    adventure: () => { // rising "let's go" two-note
      tone(523, { type: 'triangle', dur: 0.11, gain: 0.16 });
      tone(784, { type: 'triangle', dur: 0.2, gain: 0.18, delay: 0.09 });
    },
    cards: () => { // quick pluck arpeggio
      tone(660, { type: 'square', dur: 0.07, gain: 0.09, filterFreq: 2200 });
      tone(880, { type: 'square', dur: 0.07, gain: 0.09, filterFreq: 2200, delay: 0.055 });
      tone(1175, { type: 'square', dur: 0.1, gain: 0.1, filterFreq: 2600, delay: 0.11 });
    },
    zukan: () => { // low wavering, faintly spooky
      tone(196, { type: 'sine', dur: 0.55, gain: 0.13, detune: -9 });
      tone(200, { type: 'sine', dur: 0.55, gain: 0.13, detune: 9, delay: 0.02 });
    },
    workshop: () => { // woody double-knock
      tone(110, { type: 'square', dur: 0.06, gain: 0.15, filterFreq: 500 });
      tone(98, { type: 'square', dur: 0.09, gain: 0.15, filterFreq: 450, delay: 0.1 });
    },
    school: () => { // bright bell
      tone(1046, { type: 'sine', dur: 0.35, gain: 0.12 });
      tone(2093, { type: 'sine', dur: 0.25, gain: 0.05 });
    },
    curricula: () => { // three-note climb
      tone(440, { type: 'triangle', dur: 0.1, gain: 0.13 });
      tone(554, { type: 'triangle', dur: 0.1, gain: 0.13, delay: 0.09 });
      tone(659, { type: 'triangle', dur: 0.18, gain: 0.15, delay: 0.18 });
    },
    tour: () => { // quiet, warm single tone
      tone(392, { type: 'sine', dur: 0.3, gain: 0.12 });
    },
    bryan: () => { // quiet, warm single tone, gentle upward slide
      tone(330, { type: 'sine', dur: 0.32, gain: 0.12, slideTo: 349 });
    },
  };

  // ── TILE CLICK: play the tile's sound, pulse it, then navigate ──
  document.querySelectorAll('.tile').forEach((tile) => {
    tile.addEventListener('click', (e) => {
      // let modifier-clicks and middle-clicks behave normally (new tab, etc.)
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
      e.preventDefault();

      const key = tile.dataset.sound;
      if (TILE_SOUNDS[key]) {
        try { TILE_SOUNDS[key](); } catch (err) { /* ignore audio errors */ }
      }
      tile.classList.add('tile-pulse');

      const href = tile.getAttribute('href');
      setTimeout(() => { window.location.href = href; }, 220);
    });
  });

  // ── WELCOME GATE: one dedicated "Enter" gesture starts the BGM, ──
  // ── so it never races a tile's own click sound. ──
  const ENTERED_KEY = 'boohaWorldEntered';
  const overlay = document.getElementById('welcome-overlay');
  const enterBtn = document.getElementById('welcome-enter-btn');
  const soundToggle = document.getElementById('sound-toggle');

  function hasEnteredBefore() {
    try { return sessionStorage.getItem(ENTERED_KEY) === '1'; } catch (err) { return false; }
  }
  function markEntered() {
    try { sessionStorage.setItem(ENTERED_KEY, '1'); } catch (err) { /* private mode, etc. */ }
  }

  function startBGM() {
    soundToggle.classList.add('visible');
    audio.play().then(() => {
      soundToggle.classList.add('playing');
      soundToggle.setAttribute('aria-label', 'Mute background music');
    }).catch(() => {
      soundToggle.classList.remove('playing');
      soundToggle.setAttribute('aria-label', 'Play background music');
    });
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
    setTimeout(() => { overlay.style.display = 'none'; }, 650);
  }

  if (hasEnteredBefore()) {
    // returning to the menu from another page within this browser session —
    // skip the gate; try a quiet autoplay, and leave the sound toggle as a
    // manual fallback since the browser may block audio without a fresh gesture
    overlay.style.display = 'none';
    window.addEventListener('load', () => {
      setTimeout(startBGM, 400);
    });
  } else {
    enterBtn.addEventListener('click', () => {
      markEntered();
      ensureCtx(); // warm the WebAudio context on this same gesture, so the first tile click has zero latency
      startBGM();
      hideOverlay();
    });
  }

  soundToggle.addEventListener('click', () => {
    if (audio.paused) {
      startBGM();
    } else {
      audio.pause();
      soundToggle.classList.remove('playing');
      soundToggle.setAttribute('aria-label', 'Play background music');
    }
  });
</script>

</body>
</html>
